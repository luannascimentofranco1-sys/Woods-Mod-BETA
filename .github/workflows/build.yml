name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CherryAcaciaWoods.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: CherryAcaciaWoods-scmod
          path: "**/*.scmod"